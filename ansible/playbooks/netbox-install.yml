---
- name: Install and configure NetBox
  hosts: netbox_servers
  gather_facts: true

  vars:
    netbox_version: "4.7.0"
    netbox_release_tag: "v{{ netbox_version }}"
    netbox_release_path: "/opt/netbox-{{ netbox_version }}"
    netbox_path: /opt/netbox

    netbox_db_password: "{{ lookup('env', 'NETBOX_DB_PASSWORD') }}"
    netbox_secret_key: "{{ lookup('env', 'NETBOX_SECRET_KEY') }}"
    netbox_api_token_pepper: >-
      {{ lookup('env', 'NETBOX_API_TOKEN_PEPPER') }}
    netbox_admin_password: "{{ lookup('env', 'NETBOX_ADMIN_PASSWORD') }}"

  pre_tasks:
    - name: Verify required secrets were supplied
      ansible.builtin.assert:
        that:
          - netbox_db_password | length >= 32
          - netbox_secret_key | length >= 50
          - netbox_api_token_pepper | length >= 50
          - netbox_admin_password | length >= 12
        fail_msg: >-
          One or more required NetBox secrets are missing or too short.
      no_log: true

    - name: Verify supported Python version
      ansible.builtin.assert:
        that:
          - ansible_python.version.major == 3
          - ansible_python.version.minor >= 12
          - ansible_python.version.minor <= 14
        fail_msg: >-
          NetBox 4.7 requires Python 3.12 through Python 3.14.

  tasks:
    - name: Install NetBox system dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - git
          - libffi-dev
          - libpq-dev
          - libssl-dev
          - libxml2-dev
          - libxslt1-dev
          - nginx
          - pkg-config
          - python3
          - python3-dev
          - python3-pip
          - python3-venv
          - redis-server
          - zlib1g-dev
        state: present
        update_cache: true

    - name: Enable and start Redis
      ansible.builtin.service:
        name: redis-server
        state: started
        enabled: true

    - name: Verify Redis responds
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping
      changed_when: false
      failed_when: redis_ping.stdout != "PONG"

    - name: Create the NetBox system account
      ansible.builtin.user:
        name: netbox
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        state: present

    - name: Download the pinned NetBox release
      ansible.builtin.git:
        repo: https://github.com/netbox-community/netbox.git
        dest: "{{ netbox_release_path }}"
        version: "{{ netbox_release_tag }}"
        depth: 1
        single_branch: true
        update: false

    - name: Create the stable NetBox symlink
      ansible.builtin.file:
        src: "{{ netbox_release_path }}"
        dest: "{{ netbox_path }}"
        state: link
        force: true

    - name: Install the NetBox configuration
      ansible.builtin.template:
        src: templates/netbox-configuration.py.j2
        dest: "{{ netbox_release_path }}/netbox/netbox/configuration.py"
        owner: root
        group: netbox
        mode: "0640"
      no_log: true
      notify:
        - Restart NetBox
        - Restart NetBox worker

    - name: Give NetBox ownership of writable directories
      ansible.builtin.file:
        path: "{{ item }}"
        owner: netbox
        group: netbox
        recurse: true
      loop:
        - "{{ netbox_release_path }}/netbox/media"
        - "{{ netbox_release_path }}/netbox/reports"
        - "{{ netbox_release_path }}/netbox/scripts"

    - name: Run NetBox installation and database migrations
      ansible.builtin.command:
        cmd: "{{ netbox_path }}/upgrade.sh"
        chdir: "{{ netbox_path }}"
      environment:
        PYTHON: /usr/bin/python3
      register: netbox_upgrade
      changed_when: true
      no_log: true

    - name: Install the Gunicorn configuration
      ansible.builtin.copy:
        src: "{{ netbox_path }}/contrib/gunicorn.py"
        dest: "{{ netbox_release_path }}/gunicorn.py"
        remote_src: true
        owner: root
        group: netbox
        mode: "0644"
      notify: Restart NetBox

    - name: Install NetBox systemd units
      ansible.builtin.copy:
        src: "{{ netbox_path }}/contrib/{{ item }}.service"
        dest: "/etc/systemd/system/{{ item }}.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop:
        - netbox
        - netbox-rq
      notify:
        - Reload systemd
        - Restart NetBox
        - Restart NetBox worker

    - name: Flush handlers before starting services
      ansible.builtin.meta: flush_handlers

    - name: Enable and start NetBox services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - netbox
        - netbox-rq

    - name: Check whether the administrator exists
      ansible.builtin.command:
        argv:
          - "{{ netbox_path }}/venv/bin/python"
          - "{{ netbox_path }}/netbox/manage.py"
          - shell
          - --command
          - >-
            from django.contrib.auth import get_user_model;
            print(get_user_model().objects.filter(username='admin').exists())
      register: netbox_admin_exists
      changed_when: false

    - name: Create the initial NetBox administrator
      ansible.builtin.command:
        argv:
          - "{{ netbox_path }}/venv/bin/python"
          - "{{ netbox_path }}/netbox/manage.py"
          - createsuperuser
          - --noinput
      environment:
        DJANGO_SUPERUSER_USERNAME: admin
        DJANGO_SUPERUSER_EMAIL: ""
        DJANGO_SUPERUSER_PASSWORD: "{{ netbox_admin_password }}"
      when: "'True' not in netbox_admin_exists.stdout"
      no_log: true

    - name: Remove the default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Install the NetBox nginx site
      ansible.builtin.template:
        src: templates/netbox-nginx.conf.j2
        dest: /etc/nginx/sites-available/netbox
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable the NetBox nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/netbox
        dest: /etc/nginx/sites-enabled/netbox
        state: link
      notify: Reload nginx

    - name: Validate the nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Flush nginx handler
      ansible.builtin.meta: flush_handlers

    - name: Enable and start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Wait for the NetBox web interface
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
        return_content: false
      register: netbox_http
      retries: 12
      delay: 5
      until: netbox_http.status == 200

    - name: Report successful installation
      ansible.builtin.debug:
        msg:
          - "NetBox {{ netbox_version }} is running."
          - "Open http://10.0.150.139/"
          - "Initial username: admin"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart NetBox
      ansible.builtin.service:
        name: netbox
        state: restarted

    - name: Restart NetBox worker
      ansible.builtin.service:
        name: netbox-rq
        state: restarted

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
